version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: gocraft
    main: ./cmd/gocraft
    binary: gocraft
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^test:"
      - "^chore:"
  groups:
    - title: "Features"
      regexp: '^.*?feat(\([^\)]+\))?:'
      order: 0
    - title: "Bug Fixes"
      regexp: '^.*?fix(\([^\)]+\))?:'
      order: 1
    - title: "Performance Improvements"
      regexp: '^.*?perf(\([^\)]+\))?:'
      order: 2
    - title: "Documentation"
      regexp: '^.*?docs(\([^\)]+\))?:'
      order: 3
    - title: "Refactoring"
      regexp: '^.*?refactor(\([^\)]+\))?:'
      order: 4
    - title: "Other Changes"
      order: 999
